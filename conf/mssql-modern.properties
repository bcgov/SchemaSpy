# Overrides the bundled `mssql` type, which targets the legacy pre-2005
# "jdbc:microsoft:sqlserver://" driver, with the modern Microsoft JDBC driver.
extends=mssql

connectionSpec=jdbc:sqlserver://<hostOptionalPort>;databaseName=<db>;encrypt=true;trustServerCertificate=true
driver=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Use -dp to override.
driverPath=/app/lib/mssql-jdbc.jar
